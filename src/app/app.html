<main class="app">
  <header class="top">
    <h1>Minesweeper</h1>

    <div class="tools">
      <button
        type="button"
        class="icon-button"
        aria-label="Customize board and background"
        aria-haspopup="dialog"
        (click)="customizeDialog.open()"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M10 2.5a7.5 7.5 0 1 0 0 15c.9 0 1.5-.6 1.5-1.4 0-.9-.8-1.2-.8-2.1 0-.8.6-1.4 1.5-1.4h1.7a3.6 3.6 0 0 0 3.6-3.6c0-3.6-3.4-6.5-7.5-6.5z"
          />
          <circle cx="6.3" cy="9.3" r="1" />
          <circle cx="8.6" cy="6" r="1" />
          <circle cx="12.4" cy="6.3" r="1" />
        </svg>
      </button>
      <button
        type="button"
        class="icon-button"
        [attr.aria-label]="
          settings.effectiveTheme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
        (click)="settings.toggleTheme()"
      >
        @if (settings.effectiveTheme() === 'dark') {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="3.5" />
            <path
              d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M16.5 12.2A6.8 6.8 0 0 1 7.8 3.5a6.8 6.8 0 1 0 8.7 8.7z" />
          </svg>
        }
      </button>
      <button
        type="button"
        class="icon-button"
        aria-label="Settings"
        aria-haspopup="dialog"
        (click)="settingsDialog.open()"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 5.5h8M15 5.5h2M3 14.5h2M9 14.5h8" />
          <circle cx="13" cy="5.5" r="2" />
          <circle cx="7" cy="14.5" r="2" />
        </svg>
      </button>
    </div>

    <app-difficulty-picker />
  </header>

  <app-game-header />
  <app-board />
  <app-controls-hint />
</main>

<app-settings-dialog #settingsDialog />
<app-customize-dialog #customizeDialog />
