<div class="segmented levels" role="group" aria-label="Difficulty">
  @for (preset of presets; track preset.id) {
    <button
      type="button"
      [disabled]="game.mode() === 'match'"
      [attr.aria-pressed]="game.difficulty() === preset.id"
      (click)="game.setDifficulty(preset.id)"
    >
      {{ preset.label }}
    </button>
  }
  <button
    type="button"
    [disabled]="game.mode() === 'match'"
    [attr.aria-pressed]="game.difficulty() === 'custom'"
    (click)="game.setDifficulty('custom')"
  >
    Custom
  </button>
</div>

@if (game.difficulty() === 'custom' && game.mode() === 'solo') {
  <form
    class="custom"
    (submit)="
      $event.preventDefault();
      applyCustom(rows.valueAsNumber, cols.valueAsNumber, mines.valueAsNumber)
    "
  >
    <label>
      <span>Columns</span>
      <input
        #cols
        type="number"
        inputmode="numeric"
        [min]="limits.minSize"
        [max]="limits.maxCols"
        [value]="game.config().cols"
      />
    </label>
    <label>
      <span>Rows</span>
      <input
        #rows
        type="number"
        inputmode="numeric"
        [min]="limits.minSize"
        [max]="limits.maxRows"
        [value]="game.config().rows"
      />
    </label>
    <label>
      <span>Mines</span>
      <input #mines type="number" inputmode="numeric" min="1" [value]="game.config().mines" />
    </label>
    <button type="submit" class="button">Start</button>
  </form>
}
