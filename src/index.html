<!doctype html>
<html lang="en">
  <head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="9c54d3c8-a97f-4d4c-9f26-43a589c35149"></script>
    <meta charset="utf-8" />
    <title>Minesweeper</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Minesweeper in your browser: no-guessing boards, hints, themes, keyboard play and a 1v1 mode against a friend or a bot. No account needed."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <!-- The SVG stays sharp at every size; the .ico is for older browsers. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script src="early-theme.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>This game needs JavaScript. Please turn it on in your browser.</noscript>
    <!-- Never shown. Netlify reads this when deploying to learn about the form in the feedback dialog. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="kind" />
      <textarea name="message"></textarea>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
