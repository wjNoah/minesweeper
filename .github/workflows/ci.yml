# Runs the tests and a production build for every pull request and every push to main,
# so a broken change is caught before Netlify publishes it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # "ci" installs exactly what package-lock.json says (and fails if it is out of date).
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
      # Known vulnerabilities in the packages the site ships.
      - run: npm audit --omit=dev --audit-level=high
