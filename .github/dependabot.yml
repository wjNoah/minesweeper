# Opens a pull request when a package or a GitHub Action has a newer version,
# so security fixes do not wait for someone to remember.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
